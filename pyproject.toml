[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-autocorrect"
version = "0.1.0.dev0"
description = "Conservative, local autocorrect for Claude Code and Codex CLI prompts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Harshith Yallampalli" },
]
keywords = ["autocorrect", "terminal", "claude-code", "codex", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Terminals",
]
dependencies = [
  "symspellpy>=6.10,<7",
]

[project.scripts]
cli-autocorrect = "cli_autocorrect.cli:main"

[project.urls]
Homepage = "https://github.com/harshu11-ai/CLI-Autocorrect"
Repository = "https://github.com/harshu11-ai/CLI-Autocorrect"
Issues = "https://github.com/harshu11-ai/CLI-Autocorrect/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
